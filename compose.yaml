name: ${COMPOSE_PROJECT_NAME:-majestic-carga}

x-app: &app
  restart: unless-stopped
  init: true
  environment: &env
    ConnectionStrings__Db: Host=postgres;Database=cargas;Username=app;Password=${POSTGRES_PASSWORD:?run setup_env.py}
    Jwt__Key: ${JWT_KEY:?run setup_env.py}
    InternalKey: ${INTERNAL_KEY:?run setup_env.py}
    Rabbit__Host: rabbitmq
    Rabbit__User: app
    Rabbit__Password: ${RABBITMQ_PASSWORD:?run setup_env.py}
    ControlUrl: http://control:8080
    ImporterUrl: http://importer:8080
    NotifierUrl: http://notifier:8080
    FilesUrl: http://seaweedfs:8888
    MaxUploadBytes: "10485760"
    MaxRows: "50000"
    MaxExpandedBytes: "104857600"
    ProcessingDelayMs: "${PROCESSING_DELAY_MS:-0}"
    AfterPersistDelayMs: "${AFTER_PERSIST_DELAY_MS:-0}"
    Jwt__Issuer: majestic-carga
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    seaweedfs:
      condition: service_started
  healthcheck:
    test: [CMD, dotnet, App.dll, --healthcheck]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 30s
  networks: [backend]

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: cargas
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U app -d cargas']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [backend]

  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes: [rabbit-data:/var/lib/rabbitmq]
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${RABBIT_UI_PORT:-15672}:15672"]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [backend]

  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    command: server -dir=/data -master.port=9333 -volume.port=8081 -filer -filer.port=8888 -ip=seaweedfs -volume.max=5
    volumes:
      - files-data:/data
      - ./backend/config/filer.toml:/etc/seaweedfs/filer.toml:ro
    restart: unless-stopped
    networks: [backend]

  mailpit:
    image: axllent/mailpit:v1.27.8
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes: [mail-data:/data]
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${MAIL_UI_PORT:-8025}:8025"]
    restart: unless-stopped
    networks: [backend]

  auth:
    <<: *app
    build: {context: ./backend, args: {SERVICE: Auth}}
    environment:
      <<: *env
      Demo__Email: ${DEMO_EMAIL}
      Demo__Password: ${DEMO_PASSWORD}

  control:
    <<: *app
    build: {context: ./backend, args: {SERVICE: Control}}

  importer:
    <<: *app
    build: {context: ./backend, args: {SERVICE: Importer}}

  notifier:
    <<: *app
    build: {context: ./backend, args: {SERVICE: Notifier}}
    environment:
      <<: *env
      Smtp__Host: ${SMTP_HOST:-mailpit}
      Smtp__Port: ${SMTP_PORT:-1025}
      Smtp__Security: ${SMTP_SECURITY:-None}
      Smtp__User: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__From: ${SMTP_FROM:-noreply@example.test}
      Notification__RecipientOverride: ${NOTIFICATION_TEST_RECIPIENT:-}

  gateway:
    <<: *app
    build: {context: ./backend, args: {SERVICE: Gateway}}
    environment:
      <<: *env
      AuthUrl: http://auth:8080
    depends_on:
      auth: {condition: service_healthy}
      control: {condition: service_healthy}
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8080}:8080"]

  frontend:
    build: .
    restart: unless-stopped
    init: true
    networks: [web]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    image: nginx:1.28-alpine
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-5180}:80"]
    volumes:
      - ./deploy/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend: {condition: service_healthy}
      gateway: {condition: service_healthy}
    restart: unless-stopped
    networks: [web, backend]

volumes:
  postgres-data:
  rabbit-data:
  files-data:
  mail-data:

networks:
  backend:
  web:
