name: Full solution checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
  compose-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/export_migrations.py
      - run: git diff --exit-code -- backend/database/migrate.sql
      - run: python3 scripts/verify_local.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-evidence
          path: artifacts/*.json
